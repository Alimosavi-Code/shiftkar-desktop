name: Build & Release Desktop Installers (x64 + ARM64 for Linux, macOS & Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "6.1.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==================================================================
  # 1. LINUX x64 / x86_64 (.deb, .rpm, .AppImage, Portable .tar.gz)
  # ==================================================================
  build-linux-x64:
    name: Linux x64 (.deb / .rpm / .AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (x64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'x64'
          cache: 'gradle'

      - name: Install RPM & AppImage build tools (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm file libfuse2
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Desktop Unit Tests
        run: ./gradlew :composeApp:desktopTest --stacktrace

      - name: Package Linux x64 DEB, RPM & Distributable App
        run: ./gradlew :composeApp:packageDeb :composeApp:packageRpm :composeApp:createDistributable --stacktrace

      - name: Standardize Linux x64 Filenames & Build .AppImage
        run: |
          mkdir -p dist/linux-x64
          for f in composeApp/build/compose/binaries/main/deb/*.deb; do
            cp "$f" "dist/linux-x64/ShiftKar-${APP_VERSION}-linux-x64.deb"
          done
          for f in composeApp/build/compose/binaries/main/rpm/*.rpm; do
            cp "$f" "dist/linux-x64/ShiftKar-${APP_VERSION}-linux-x64.rpm"
          done
          APP_DIR=$(find composeApp/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n 1)
          tar -czf "dist/linux-x64/ShiftKar-${APP_VERSION}-linux-x64-portable.tar.gz" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          cat << 'DESKTOP_EOF' > "$APP_DIR/ShiftKar.desktop"
          [Desktop Entry]
          Name=ShiftKar
          Comment=ShiftKar Smart Shift Calendar
          Exec=ShiftKar
          Icon=ShiftKar
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP_EOF
          cp composeApp/packaging/ShiftKar.png "$APP_DIR/ShiftKar.png"
          cp composeApp/packaging/ShiftKar.png "$APP_DIR/.DirIcon"
          ln -sf bin/ShiftKar "$APP_DIR/AppRun"
          chmod +x "$APP_DIR/AppRun" "$APP_DIR/bin/ShiftKar"
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APP_DIR" "dist/linux-x64/ShiftKar-${APP_VERSION}-linux-x64.AppImage"

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShiftKar-Linux-x64
          path: dist/linux-x64/*

  # ==================================================================
  # 2. LINUX ARM64 / aarch64 (.deb, .rpm, .AppImage, Portable .tar.gz)
  # ==================================================================
  build-linux-arm64:
    name: Linux ARM64 (.deb / .rpm / .AppImage)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (aarch64 / arm64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'aarch64'
          cache: 'gradle'

      - name: Install RPM & AppImage build tools (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm file libfuse2
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package Linux ARM64 DEB, RPM & Distributable App
        run: ./gradlew :composeApp:packageDeb :composeApp:packageRpm :composeApp:createDistributable --stacktrace

      - name: Standardize Linux ARM64 Filenames & Build .AppImage
        run: |
          mkdir -p dist/linux-arm64
          for f in composeApp/build/compose/binaries/main/deb/*.deb; do
            cp "$f" "dist/linux-arm64/ShiftKar-${APP_VERSION}-linux-arm64.deb"
          done
          for f in composeApp/build/compose/binaries/main/rpm/*.rpm; do
            cp "$f" "dist/linux-arm64/ShiftKar-${APP_VERSION}-linux-arm64.rpm"
          done
          APP_DIR=$(find composeApp/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n 1)
          tar -czf "dist/linux-arm64/ShiftKar-${APP_VERSION}-linux-arm64-portable.tar.gz" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          cat << 'DESKTOP_EOF' > "$APP_DIR/ShiftKar.desktop"
          [Desktop Entry]
          Name=ShiftKar
          Comment=ShiftKar Smart Shift Calendar
          Exec=ShiftKar
          Icon=ShiftKar
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP_EOF
          cp composeApp/packaging/ShiftKar.png "$APP_DIR/ShiftKar.png"
          cp composeApp/packaging/ShiftKar.png "$APP_DIR/.DirIcon"
          ln -sf bin/ShiftKar "$APP_DIR/AppRun"
          chmod +x "$APP_DIR/AppRun" "$APP_DIR/bin/ShiftKar"
          ARCH=aarch64 /tmp/appimagetool --appimage-extract-and-run "$APP_DIR" "dist/linux-arm64/ShiftKar-${APP_VERSION}-linux-arm64.AppImage"

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShiftKar-Linux-ARM64
          path: dist/linux-arm64/*

  # ==================================================================
  # 3. macOS Apple Silicon ARM64 (M1/M2/M3/M4 .dmg)
  # ==================================================================
  build-macos-arm64:
    name: macOS Apple Silicon ARM64 (.dmg)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Apple Silicon arm64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'aarch64'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package macOS Apple Silicon DMG
        run: |
          ./gradlew :composeApp:packageDmg --stacktrace --no-daemon || (sleep 5 && ./gradlew :composeApp:packageDmg --stacktrace --no-daemon)
          mkdir -p dist/macos-arm64
          for f in composeApp/build/compose/binaries/main/dmg/*.dmg; do
            cp "$f" "dist/macos-arm64/ShiftKar-${APP_VERSION}-macos-arm64.dmg"
          done

      - name: Upload macOS Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: ShiftKar-macOS-ARM64
          path: dist/macos-arm64/*.dmg

  # ==================================================================
  # 4. macOS Intel x64 / x86_64 (.dmg)
  # ==================================================================
  build-macos-intel-x64:
    name: macOS Intel x64 (.dmg)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Intel x64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'x64'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package macOS Intel x64 DMG
        run: |
          ./gradlew :composeApp:packageDmg --stacktrace --no-daemon || (sleep 5 && ./gradlew :composeApp:packageDmg --stacktrace --no-daemon)
          mkdir -p dist/macos-x64
          for f in composeApp/build/compose/binaries/main/dmg/*.dmg; do
            cp "$f" "dist/macos-x64/ShiftKar-${APP_VERSION}-macos-x64.dmg"
          done

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: ShiftKar-macOS-x64
          path: dist/macos-x64/*.dmg

  # ==================================================================
  # 5. WINDOWS x64 / x86_64 (.msi, .exe, Portable .zip)
  # ==================================================================
  build-windows-x64:
    name: Windows x64 (.msi / .exe / .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (x64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'x64'
          cache: 'gradle'

      - name: Ensure WiX Toolset v3 & Inno Setup are in PATH
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixBin) {
            echo "$($wixBin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package Windows x64 MSI, EXE & Portable ZIP
        shell: powershell
        run: |
          .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe :composeApp:createDistributable --stacktrace --no-daemon
          New-Item -ItemType Directory -Force -Path "dist\windows-x64" | Out-Null
          Get-ChildItem "composeApp\build\compose\binaries\main\msi\*.msi" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\windows-x64\ShiftKar-$($env:APP_VERSION)-windows-x64.msi"
          }
          Get-ChildItem "composeApp\build\compose\binaries\main\exe\*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\windows-x64\ShiftKar-$($env:APP_VERSION)-windows-x64-setup.exe"
          }
          Compress-Archive -Path "composeApp\build\compose\binaries\main\app\*" -DestinationPath "dist\windows-x64\ShiftKar-$($env:APP_VERSION)-windows-x64-portable.zip" -Force

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShiftKar-Windows-x64
          path: dist/windows-x64/*

  # ==================================================================
  # 6. WINDOWS ARM64 / aarch64 (.msi, .exe, Portable .zip)
  # ==================================================================
  build-windows-arm64:
    name: Windows ARM64 (.msi / .exe / .zip)
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Windows 11 ARM64 compatible)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'x64'
          cache: 'gradle'

      - name: Ensure Inno Setup & WiX are available
        shell: powershell
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixBin) {
            echo "$($wixBin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package Windows ARM64 Distributable, EXE & MSI
        shell: powershell
        run: |
          .\gradlew.bat :composeApp:createDistributable --stacktrace --no-daemon
          New-Item -ItemType Directory -Force -Path "dist\windows-arm64" | Out-Null
          Compress-Archive -Path "composeApp\build\compose\binaries\main\app\*" -DestinationPath "dist\windows-arm64\ShiftKar-$($env:APP_VERSION)-windows-arm64-portable.zip" -Force
          .\gradlew.bat :composeApp:packageExe --stacktrace --no-daemon
          Get-ChildItem "composeApp\build\compose\binaries\main\exe\*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\windows-arm64\ShiftKar-$($env:APP_VERSION)-windows-arm64-setup.exe"
          }
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            .\gradlew.bat :composeApp:packageMsi --stacktrace --no-daemon
            Get-ChildItem "composeApp\build\compose\binaries\main\msi\*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "dist\windows-arm64\ShiftKar-$($env:APP_VERSION)-windows-arm64.msi"
            }
          }

      - name: Upload Windows ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShiftKar-Windows-ARM64
          path: dist/windows-arm64/*

  # ==================================================================
  # 7. AUTOMATIC GITHUB RELEASE & TAG PUBLISHER
  #    Runs after all 6 platform builds succeed, creates/updates tag
  #    `v6.1.0`, and uploads all standardized installers to Releases!
  # ==================================================================
  publish-release:
    name: Publish GitHub Release (v6.1.0)
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-macos-arm64
      - build-macos-intel-x64
      - build-windows-x64
      - build-windows-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Built Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Files
        run: ls -lh release-assets/

      - name: Create Tag & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/overwriting assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "ShiftKar Desktop v${APP_VERSION}" \
              --notes "Automated multi-architecture Desktop release (Linux DEB/RPM/AppImage x64 & ARM64, macOS Apple Silicon & Intel DMG, Windows x64 & ARM64 EXE/MSI)." \
              --target "${{ github.sha }}"
          fi
